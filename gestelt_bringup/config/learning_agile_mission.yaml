# NN_model_name: 'training_results/new_format/2025-02-24/16-45-20/trained_model/NN_close_100.pth' #**#
# NN_model_name: 'training_results/new_format/2025-03-11/09-58-34/trained_model/NN_close_200.pth' #**# without BPTT
NN_model_name: 'training_results/new_format/2025-05-08/15-43-00/trained_model/NN_close_100.pth' 
# NN_model_name: 'training_results/new_format/2025-01-22/10-26-33/trained_model/NN_close_120.pth' # train for the moving gate

NN_deploy_model_name: 'deployed_model/2025-01-16/09-59-31/trained_model/NN_close_3200.pth' # used in the sitl
NN_freq: 100

penalty:
  QUADRATIC_LOSS: false #or Linear loss
  vel_w: -3
  goal_x_axis_w: 2
  goal_yz_axis_w: 2 #12.0 for last 5 nodes, 240 for last 3 nodes (yz axis)
  scaling_w: 100 #100 for quadratic loss
  det_reg_w: 0.0
  control_reg_w: 0

LBFGS: false
POSITION_ENCODING: false