NN_deploy_model_name: 'deployed_model/2025-01-13/18-41-04/trained_model/NN_close_200.pth' # used in the sitl
NN_freq: 20

reward:
  goal_x_axis_w: 5
  goal_yz_axis_w: 100 #12.0 for last 5 nodes, 240 for last 3 nodes (yz axis)
  scaling_w: 100